name: Test project setup
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare lint template validation tools
        run: |
          python3 -m pip install ruff==0.8.6
          curl -fL --retry 3 https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.20.2/checkstyle-10.20.2-all.jar -o "$RUNNER_TEMP/checkstyle.jar"
          echo "SETUP_TEST_CHECKSTYLE_JAR=$RUNNER_TEMP/checkstyle.jar" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n scripts/install-skills.sh && sh -n scripts/setup.sh
      - run: git diff --check
