# golangci-lint v2; formatting remains a separate gofmt check.
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - nolintlint
    # Readability metrics: see docs/lint.md for official references and policy.
    - funlen
    - lll
    - gocyclo
    - gocognit
    - nestif
    - nakedret
  settings:
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    lll:
      line-length: 120
      tab-width: 1
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 30
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
